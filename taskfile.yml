version: '3'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the project
    cmds:
      - swift build

  run:
    desc: Build and run, producing Build/caddy.3mf
    cmds:
      - swift run caddy

  clean:
    desc: Remove build artifacts and generated models
    cmds:
      - swift package clean
      - rm -rf .build
      - rm -rf Build
      - rm -f Docs/Cutlist.md

  resolve:
    desc: Resolve Swift package dependencies
    cmds:
      - swift package resolve

  update:
    desc: Update Swift package dependencies
    cmds:
      - swift package update

  decrypt:
    desc: Pull encrypted assets from LFS and decrypt them
    # ctg only auto-discovers .cottage/identity or ~/.ssh, so point it at the
    # global identity if one exists. Override with COTTAGE_IDENTITY=... if elsewhere.
    env:
      COTTAGE_IDENTITY:
        sh: 'test -f "$HOME/.config/cottage/identity" && echo "$HOME/.config/cottage/identity" || echo "${COTTAGE_IDENTITY:-}"'
    cmds:
      - git lfs pull
      - ctg decrypt Assets/*.cott.age
