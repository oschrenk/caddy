version: '3'
tasks:
  default:
    cmds:
      - task: build:all
  build:all:
    desc: Build all targets
    cmds:
      - swift build
  resolve:
    desc: Resolve Swift package dependencies
    cmds:
      - swift package resolve
  update:
    desc: Update Swift package dependencies
    cmds:
      - swift package update
  clean:
    desc: Remove build artifacts and every project's generated models
    cmds:
      - swift package clean
      - rm -rf .build
      - rm -rf Build
      - rm -f Docs/*/Cutlist.md
  decrypt:
    desc: Pull encrypted assets from LFS and decrypt them
    # ctg only auto-discovers .cottage/identity or ~/.ssh, so point it at the
    # global identity if one exists. Override with COTTAGE_IDENTITY=... if elsewhere.
    env:
      COTTAGE_IDENTITY:
        sh: 'test -f "$HOME/.config/cottage/identity" && echo "$HOME/.config/cottage/identity" || echo "${COTTAGE_IDENTITY:-}"'
    cmds:
      - git lfs pull
      - ctg decrypt Assets/models/*.cott.age
  #
  # ----- Projects ----
  #
  # One group per project. Run from the repo root — the generators write to
  # paths relative to the working directory.
  build:caddy:
    desc: Build and run the caddy, producing Build/Caddy/caddy.3mf
    cmds:
      - swift run caddy
  clean:caddy:
    desc: Remove the caddy's generated models and cutlist
    cmds:
      - rm -rf Build/Caddy
      - rm -f Docs/Caddy/Cutlist.md
  build:shoerack:
    desc: Build and run the shoe rack, producing Build/Shoerack/shoerack.3mf
    cmds:
      - swift run shoerack
  clean:shoerack:
    desc: Remove the shoe rack's generated models and cutlist
    cmds:
      - rm -rf Build/Shoerack
      - rm -f Docs/Shoerack/Cutlist.md
  build:pila:
    desc: Build and run the pila lid, producing Build/Pila/pila.3mf
    cmds:
      - swift run pila
  clean:pila:
    desc: Remove the pila's generated models and cutlist
    cmds:
      - rm -rf Build/Pila
      - rm -f Docs/Pila/Cutlist.md
  build:couch:
    desc: Build and run the couch, producing Build/Couch/couch.3mf
    cmds:
      - swift run couch
  clean:couch:
    desc: Remove the couch's generated models and cutlist
    cmds:
      - rm -rf Build/Couch
      - rm -f Docs/Couch/Cutlist.md
  build:routerbase:
    desc: Build and run the router base, producing Build/RouterBase/router-square-base.3mf
    cmds:
      - swift run routerbase
  clean:routerbase:
    desc: Remove the router base's generated models
    cmds:
      - rm -rf Build/RouterBase
